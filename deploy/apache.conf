# TempMail — Apache 2.4 virtual host (plain VPS, no control panel).
#
# Copy to /etc/apache2/sites-available/tempmail.conf (Debian/Ubuntu) or
# /etc/httpd/conf.d/tempmail.conf (CentOS/AlmaLinux), edit the three marked
# values, then enable it. Certbot fills in the TLS vhost.
#
# Required modules:
#   a2enmod rewrite headers expires proxy proxy_fcgi setenvif
#
# The rules below duplicate public/.htaccess so you can run with
# `AllowOverride None` (faster: Apache stops looking for .htaccess files).
# If you prefer .htaccess, set AllowOverride All and delete the <Directory>
# body below.

<VirtualHost *:80>
    ServerName mail.example.com

    # Certbot writes its challenge here.
    DocumentRoot /var/www/tempmail/public

    <Directory /var/www/tempmail/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # No HTTPS redirect here on purpose: `certbot --apache --redirect` adds
    # one after the certificate exists. Redirecting before that just breaks
    # the site while you are still setting it up.

    ErrorLog  ${APACHE_LOG_DIR}/tempmail-error.log
    CustomLog ${APACHE_LOG_DIR}/tempmail-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mail.example.com

    DocumentRoot /var/www/tempmail/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mail.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mail.example.com/privkey.pem

    # `setifempty` (Apache 2.4.7+) without `always`: index.php sends these on
    # its own responses, and this fills them in only where PHP is not
    # involved — static files. `always` is deliberately absent: it writes to a
    # different header table, where it cannot see PHP's header and would emit
    # each one twice. On Apache older than 2.4.7, use `set` instead.
    Header setifempty Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'"
    Header setifempty X-Frame-Options "SAMEORIGIN"
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # PHP-FPM. Check the socket path: ls /run/php/
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/tempmail/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]

        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css               "access plus 7 days"
            ExpiresByType text/javascript        "access plus 7 days"
            ExpiresByType application/javascript "access plus 7 days"
        </IfModule>
    </Directory>

    # Dotfiles are never served.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Belt and braces: these live above the document root already. Should the
    # document root ever be moved up, they still refuse.
    <DirectoryMatch "^/var/www/tempmail/(src|logs|vendor|deploy)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(config\.php|config\.example\.php|receive\.php|cleanup\.php|verify\.php|schema\.sql|composer\.(json|lock))$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/tempmail-error.log
    CustomLog ${APACHE_LOG_DIR}/tempmail-access.log combined
</VirtualHost>
</IfModule>
