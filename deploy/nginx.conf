# TempMail — nginx server block.
# Copy to /etc/nginx/sites-available/tempmail, symlink into sites-enabled,
# then run certbot (see README). Only public/ is ever served.

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tempmail/public;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on nginx 1.9.5 through 1.29; newer builds log a
    # deprecation notice and accept it. On nginx >= 1.25.1 you may instead drop
    # the http2 flags here and add a separate `http2 on;` line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com;

    # certbot --nginx fills these in.
    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # public/ only — src/, config.php, vendor/ and the CLI scripts live above it.
    root  /var/www/tempmail/public;
    index index.php;

    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    # NFR-5. The CSP has no 'unsafe-inline' for scripts; index.php sends the
    # same header, and `always` keeps it on error responses too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Never hand a request to PHP unless that exact file exists.
        try_files $uri =404;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # match your PHP version
        fastcgi_param HTTP_PROXY "";                  # ignore a "Proxy:" request header
        fastcgi_read_timeout 30s;
    }

    # Defence in depth: these live outside the root already, but a
    # misconfigured root must not start serving them.
    location ~ ^/(src|logs|vendor)/ { deny all; return 404; }
    location ~ /(config|config\.example|receive|cleanup|verify)\.php$ { deny all; return 404; }
    location ~ /(composer\.(json|lock)|schema\.sql)$ { deny all; return 404; }
    location ~ /\.                  { deny all; return 404; }

    access_log /var/log/nginx/tempmail.access.log;
    error_log  /var/log/nginx/tempmail.error.log;
}
