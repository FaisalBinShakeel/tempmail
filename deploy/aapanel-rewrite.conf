# TempMail — custom nginx rules for aaPanel.
#
# Copy this to:  /www/server/panel/vhost/rewrite/<your-domain>.conf
# aaPanel includes that file inside the site's server{} block. It is only
# overwritten if you pick a rewrite preset in the panel UI — if that happens,
# paste this back.
#
# Assumes the site's "Running directory" is set to /public.
#
# Every deny below uses `^~`, which beats regex locations in nginx. That
# matters because aaPanel's `include enable-php-XX.conf;` appears *earlier* in
# the site config and matches every *.php request; without `^~` these rules
# would never be reached.

# NFR-5 security headers.
#
# These are set only for static files, on purpose. index.php already sends all
# four on every dynamic response, and nginx's add_header appends rather than
# replaces — setting them at server level would send each header twice.
location ^~ /assets/ {
    expires 7d;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
}

# Front controller.
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# Belt and braces: these all live above the running directory already, but a
# mis-set running directory must not start serving or executing them.
location ^~ /config.php     { return 404; }
location ^~ /config.example.php { return 404; }
location ^~ /receive.php    { return 404; }
location ^~ /cleanup.php    { return 404; }
location ^~ /verify.php     { return 404; }
location ^~ /schema.sql     { return 404; }
location ^~ /composer.json  { return 404; }
location ^~ /composer.lock  { return 404; }
location ^~ /src/           { return 404; }
location ^~ /logs/          { return 404; }
location ^~ /vendor/        { return 404; }
location ^~ /deploy/        { return 404; }

# Dotfiles, but never the ACME challenge path (SSL renewal needs it).
# aaPanel's own site config usually has an equivalent rule; this covers the
# case where it does not.
location ~ ^/\.(?!well-known) { deny all; return 404; }
